<svg xmlns="http://www.w3.org/2000/svg" width="520" height="88" viewBox="0 0 520 88" fill="none">
  <defs>
    <linearGradient id="pipeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0E" />
      <stop offset="100%" stop-color="#140A10" />
    </linearGradient>
    <linearGradient id="activeNode" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#220B14" />
      <stop offset="100%" stop-color="#11050A" />
    </linearGradient>
    <filter id="wineGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .frame-box { fill: url(#pipeBg); stroke: #2D121D; stroke-width: 1; rx: 4; }
    .header-text { fill: #8B1E3F; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 8px; font-weight: 700; letter-spacing: 1.2px; }
    .node-box { fill: url(#activeNode); stroke: #4E182A; stroke-width: 1; rx: 3; }
    .node-title { fill: #E8E6E8; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 8.5px; font-weight: 700; letter-spacing: 0.5px; }
    .node-sub { fill: #8E8A90; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 7px; font-weight: 400; }
    .arrow { stroke: #5C192E; stroke-width: 1.2; stroke-dasharray: 2 2; }
    .pulse-dot {
      fill: #B8325A;
      filter: url(#wineGlow);
      animation: sweepPulse 3.5s infinite linear;
    }
    .footer-text { fill: #716C75; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 7.5px; letter-spacing: 0.4px; }

    @keyframes sweepPulse {
      0% { cx: 48; opacity: 0; }
      10% { opacity: 1; }
      90% { opacity: 1; }
      100% { cx: 472; opacity: 0; }
    }
  </style>

  <!-- Outer Card Container -->
  <rect x="0.5" y="0.5" width="519" height="87" class="frame-box" />

  <!-- Card Top Header -->
  <circle cx="12" cy="12" r="2" fill="#B8325A" />
  <text x="20" y="14.5" class="header-text">ML PIPELINE SPECIFICATION :: DEFENSE-IN-DEPTH</text>
  <line x1="10" y1="21" x2="510" y2="21" stroke="#1D0C14" stroke-width="1" />

  <!-- Pulse Dot Animating Along the Pipeline -->
  <circle cy="41" r="2.5" class="pulse-dot" />

  <!-- Node 1: Ingestion -->
  <g transform="translate(10, 27)">
    <rect width="80" height="28" class="node-box" />
    <text x="8" y="14" class="node-title">INGESTION</text>
    <text x="8" y="23" class="node-sub">Stream / URL</text>
  </g>

  <!-- Arrow 1-2 -->
  <line x1="93" y1="41" x2="108" y2="41" class="arrow" />
  <polygon points="108,39 112,41 108,43" fill="#8B1E3F" />

  <!-- Node 2: Canonicalize -->
  <g transform="translate(114, 27)">
    <rect width="90" height="28" class="node-box" />
    <text x="8" y="14" class="node-title">CANONICALIZE</text>
    <text x="8" y="23" class="node-sub">Heuristics Parse</text>
  </g>

  <!-- Arrow 2-3 -->
  <line x1="207" y1="41" x2="222" y2="41" class="arrow" />
  <polygon points="222,39 226,41 222,43" fill="#8B1E3F" />

  <!-- Node 3: CatBoost ML -->
  <g transform="translate(228, 27)">
    <rect width="84" height="28" class="node-box" />
    <text x="8" y="14" class="node-title">CATBOOST</text>
    <text x="8" y="23" class="node-sub">ML Inference</text>
  </g>

  <!-- Arrow 3-4 -->
  <line x1="315" y1="41" x2="330" y2="41" class="arrow" />
  <polygon points="330,39 334,41 330,43" fill="#8B1E3F" />

  <!-- Node 4: SHAP XAI -->
  <g transform="translate(336, 27)">
    <rect width="78" height="28" class="node-box" />
    <text x="8" y="14" class="node-title">SHAP (XAI)</text>
    <text x="8" y="23" class="node-sub">Attribution</text>
  </g>

  <!-- Arrow 4-5 -->
  <line x1="417" y1="41" x2="432" y2="41" class="arrow" />
  <polygon points="432,39 436,41 432,43" fill="#8B1E3F" />

  <!-- Node 5: Verdict -->
  <g transform="translate(438, 27)">
    <rect width="72" height="28" class="node-box" stroke="#8B1E3F" />
    <text x="8" y="14" class="node-title" fill="#B8325A">VERDICT</text>
    <text x="8" y="23" class="node-sub">Risk Policy</text>
  </g>

  <!-- Subtitle Note -->
  <line x1="10" y1="65" x2="510" y2="65" stroke="#1D0C14" stroke-width="1" />
  <text x="12" y="78" class="footer-text">TARGET INTERFACES: Decoupled Flask REST API  ·  Manifest v3 Client  ·  CLI Risk Scorer</text>
</svg>
