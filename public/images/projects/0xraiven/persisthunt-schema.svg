<svg xmlns="http://www.w3.org/2000/svg" width="520" height="88" viewBox="0 0 520 88" fill="none">
  <defs>
    <linearGradient id="huntBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0B0E" />
      <stop offset="100%" stop-color="#140A10" />
    </linearGradient>
    <linearGradient id="critBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A0D1D" />
      <stop offset="100%" stop-color="#1E070F" />
    </linearGradient>
    <filter id="critGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .frame-box { fill: url(#huntBg); stroke: #2D121D; stroke-width: 1; rx: 4; }
    .header-text { fill: #8B1E3F; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 8px; font-weight: 700; letter-spacing: 1.2px; }
    .surface-chip { fill: #111116; stroke: #331422; stroke-width: 1; rx: 3; }
    .surface-text { fill: #D6D4D8; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 8px; font-weight: 600; }
    .surface-label { fill: #B8325A; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 8px; font-weight: 700; }
    .schema-text { fill: #8E8A90; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 7.5px; }
    .sev-pill { fill: #131318; stroke: #261620; stroke-width: 1; rx: 2; }
    .sev-text { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 7px; font-weight: 600; text-anchor: middle; }
    .crit-pill {
      fill: url(#critBg);
      stroke: #8B1E3F;
      stroke-width: 1;
      rx: 2;
      animation: critPulse 2.5s infinite ease-in-out;
    }
    @keyframes critPulse {
      0%, 100% { stroke-color: #8B1E3F; }
      50% { stroke: #B8325A; filter: url(#critGlow); }
    }
  </style>

  <!-- Outer Card Container -->
  <rect x="0.5" y="0.5" width="519" height="87" class="frame-box" />

  <!-- Header -->
  <circle cx="12" cy="12" r="2" fill="#B8325A" />
  <text x="20" y="14.5" class="header-text">FINDING ENGINE SCHEMA :: PERSISTENCE VECTOR AUDIT</text>
  <line x1="10" y1="21" x2="510" y2="21" stroke="#1D0C14" stroke-width="1" />

  <!-- Attack Surfaces Row -->
  <g transform="translate(10, 27)">
    <rect width="118" height="22" class="surface-chip" />
    <text x="8" y="14.5" class="surface-label">◈ </text>
    <text x="20" y="14.5" class="surface-text">/etc/cron.*</text>
  </g>

  <g transform="translate(136, 27)">
    <rect width="128" height="22" class="surface-chip" />
    <text x="8" y="14.5" class="surface-label">◈ </text>
    <text x="20" y="14.5" class="surface-text">systemd.units</text>
  </g>

  <g transform="translate(272, 27)">
    <rect width="112" height="22" class="surface-chip" />
    <text x="8" y="14.5" class="surface-label">◈ </text>
    <text x="20" y="14.5" class="surface-text">~/.bashrc [init]</text>
  </g>

  <g transform="translate(392, 27)">
    <rect width="118" height="22" class="surface-chip" />
    <text x="8" y="14.5" class="surface-label">◈ </text>
    <text x="20" y="14.5" class="surface-text">authorized_keys</text>
  </g>

  <!-- Divider -->
  <line x1="10" y1="56" x2="510" y2="56" stroke="#1D0C14" stroke-width="1" />

  <!-- Lower Row: Finding Schema + Severity Ladder -->
  <g transform="translate(12, 63)">
    <text x="0" y="13" class="schema-text">MODEL: Finding(id, category, severity, evidence, remediation)</text>
  </g>

  <!-- Severity Ladder -->
  <g transform="translate(305, 62)">
    <!-- INFO -->
    <rect x="0" y="0" width="36" height="16" class="sev-pill" />
    <text x="18" y="11" class="sev-text" fill="#716C75">INFO</text>

    <!-- LOW -->
    <rect x="40" y="0" width="34" height="16" class="sev-pill" />
    <text x="57" y="11" class="sev-text" fill="#8E8A90">LOW</text>

    <!-- MED -->
    <rect x="78" y="0" width="34" height="16" class="sev-pill" />
    <text x="95" y="11" class="sev-text" fill="#D6A256">MED</text>

    <!-- HIGH -->
    <rect x="116" y="0" width="38" height="16" class="sev-pill" stroke="#5E1627" />
    <text x="135" y="11" class="sev-text" fill="#D6566D">HIGH</text>

    <!-- CRITICAL -->
    <rect x="158" y="0" width="46" height="16" class="crit-pill" />
    <text x="181" y="11" class="sev-text" fill="#F06584" font-weight="700">CRIT</text>
  </g>
</svg>
