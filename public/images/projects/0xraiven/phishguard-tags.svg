<svg xmlns="http://www.w3.org/2000/svg" width="430" height="24" viewBox="0 0 430 24" fill="none">
  <style>
    .tag-rect { fill: #101014; stroke: #2E121E; stroke-width: 1; rx: 3; transition: all 0.2s ease; }
    .tag-dot { fill: #B8325A; }
    .tag-text { fill: #D6D4D8; font-family: ui-monospace, 'SF Mono', Menlo, Consolas, monospace; font-size: 9px; font-weight: 500; letter-spacing: 0.3px; }
  </style>

  <!-- Tag 1: Python -->
  <g transform="translate(0, 1)">
    <rect width="66" height="22" class="tag-rect" />
    <circle cx="9" cy="11" r="2" class="tag-dot" />
    <text x="17" y="14.5" class="tag-text">Python</text>
  </g>

  <!-- Tag 2: Flask -->
  <g transform="translate(72, 1)">
    <rect width="58" height="22" class="tag-rect" />
    <circle cx="9" cy="11" r="2" class="tag-dot" />
    <text x="17" y="14.5" class="tag-text">Flask</text>
  </g>

  <!-- Tag 3: CatBoost ML -->
  <g transform="translate(136, 1)">
    <rect width="96" height="22" class="tag-rect" />
    <circle cx="9" cy="11" r="2" class="tag-dot" />
    <text x="17" y="14.5" class="tag-text">CatBoost ML</text>
  </g>

  <!-- Tag 4: SHAP (XAI) -->
  <g transform="translate(238, 1)">
    <rect width="86" height="22" class="tag-rect" />
    <circle cx="9" cy="11" r="2" class="tag-dot" />
    <text x="17" y="14.5" class="tag-text">SHAP (XAI)</text>
  </g>

  <!-- Tag 5: Chrome MV3 -->
  <g transform="translate(330, 1)">
    <rect width="94" height="22" class="tag-rect" />
    <circle cx="9" cy="11" r="2" class="tag-dot" />
    <text x="17" y="14.5" class="tag-text">Chrome MV3</text>
  </g>
</svg>
