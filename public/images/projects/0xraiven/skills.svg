<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 228" width="900" height="228" fill="none" role="img" aria-label="Skills &amp; Technologies: Languages, Security &amp; Systems, Tools &amp; Ecosystem">
  <title>Skills and Technologies</title>
  <desc>Technical skills categorized by Programming Languages, Security and Systems Engineering, and Tools and Ecosystem.</desc>

  <defs>
    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0D12"/>
      <stop offset="50%" stop-color="#111016"/>
      <stop offset="100%" stop-color="#0E0D12"/>
    </linearGradient>

    <!-- Panel Gradient -->
    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14131A"/>
      <stop offset="100%" stop-color="#0E0D13"/>
    </linearGradient>

    <!-- Wine Glow Filter -->
    <filter id="accentGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      .mono-title {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .col-header {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 1.5px;
        fill: #B8325A;
      }
      .col-tag {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 9px;
        font-weight: 600;
        fill: #716C75;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-size: 11px;
        font-weight: 500;
        fill: #E8E6E8;
      }
      .pill-box {
        fill: #16151D;
        stroke: #26212D;
        stroke-width: 1;
        rx: 5px;
        transition: stroke 0.2s ease, fill 0.2s ease;
      }
      .pill-box:hover {
        fill: #1E1C27;
        stroke: #8B1E3F;
      }
    </style>
  </defs>

  <!-- Main Container Card -->
  <rect x="1" y="1" width="898" height="226" rx="6" fill="url(#cardBg)" stroke="#292329" stroke-width="1"/>

  <!-- Top Header Bar -->
  <g transform="translate(0, 0)">
    <!-- Terminal Status Dots -->
    <circle cx="24" cy="22" r="3.5" fill="#B8325A" filter="url(#accentGlow)"/>
    <circle cx="36" cy="22" r="3.5" fill="#8B1E3F"/>
    <circle cx="48" cy="22" r="3.5" fill="#292329"/>

    <!-- Central Header Title -->
    <text x="450" y="26" text-anchor="middle" class="mono-title" fill="#E8E6E8">
      CORE SKILLS <tspan fill="#8B1E3F">//</tspan> TECH STACK
    </text>

    <!-- Top Right Meta Tag -->
    <text x="876" y="25" text-anchor="end" class="col-tag">
      ACTIVE STACK
    </text>

    <!-- Divider Line -->
    <line x1="16" y1="42" x2="884" y2="42" stroke="#211C24" stroke-width="1"/>
  </g>

  <!-- ==================== COLUMN 1: LANGUAGES ==================== -->
  <g transform="translate(18, 52)">
    <!-- Panel Background -->
    <rect x="0" y="0" width="276" height="162" rx="5" fill="url(#panelGrad)" stroke="#221D27" stroke-width="1"/>
    
    <!-- Category Header -->
    <circle cx="16" cy="20" r="3" fill="#B8325A"/>
    <text x="26" y="24" class="col-header">LANGUAGES</text>
    <text x="260" y="23" text-anchor="end" class="col-tag">[01]</text>
    <line x1="14" y1="34" x2="262" y2="34" stroke="#221D27" stroke-width="1"/>

    <!-- Pills Row 1 -->
    <g transform="translate(14, 48)">
      <rect x="0" y="0" width="80" height="28" class="pill-box"/>
      <circle cx="12" cy="14" r="2.5" fill="#B8325A"/>
      <text x="22" y="18" class="pill-text">Python</text>

      <rect x="88" y="0" width="56" height="28" class="pill-box"/>
      <circle cx="98" cy="14" r="2.5" fill="#B8325A"/>
      <text x="108" y="18" class="pill-text">Go</text>

      <rect x="152" y="0" width="82" height="28" class="pill-box"/>
      <circle cx="162" cy="14" r="2.5" fill="#B8325A"/>
      <text x="172" y="18" class="pill-text">C / C++</text>
    </g>

    <!-- Pills Row 2 -->
    <g transform="translate(14, 92)">
      <rect x="0" y="0" width="112" height="28" class="pill-box"/>
      <circle cx="12" cy="14" r="2.5" fill="#B8325A"/>
      <text x="22" y="18" class="pill-text">Bash / Shell</text>

      <rect x="120" y="0" width="114" height="28" class="pill-box"/>
      <circle cx="132" cy="14" r="2.5" fill="#B8325A"/>
      <text x="142" y="18" class="pill-text">TypeScript</text>
    </g>
  </g>

  <!-- ==================== COLUMN 2: SECURITY & SYSTEMS ==================== -->
  <g transform="translate(312, 52)">
    <!-- Panel Background -->
    <rect x="0" y="0" width="276" height="162" rx="5" fill="url(#panelGrad)" stroke="#221D27" stroke-width="1"/>
    
    <!-- Category Header -->
    <circle cx="16" cy="20" r="3" fill="#B8325A"/>
    <text x="26" y="24" class="col-header">SECURITY &amp; SYSTEMS</text>
    <text x="260" y="23" text-anchor="end" class="col-tag">[02]</text>
    <line x1="14" y1="34" x2="262" y2="34" stroke="#221D27" stroke-width="1"/>

    <!-- Pills Row 1 -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="120" height="26" class="pill-box"/>
      <circle cx="10" cy="13" r="2.5" fill="#B8325A"/>
      <text x="20" y="17" class="pill-text">Linux Internals</text>

      <rect x="128" y="0" width="120" height="26" class="pill-box"/>
      <circle cx="138" cy="13" r="2.5" fill="#B8325A"/>
      <text x="148" y="17" class="pill-text">Threat Detection</text>
    </g>

    <!-- Pills Row 2 -->
    <g transform="translate(14, 78)">
      <rect x="0" y="0" width="134" height="26" class="pill-box"/>
      <circle cx="10" cy="13" r="2.5" fill="#B8325A"/>
      <text x="20" y="17" class="pill-text">Persistence Analysis</text>

      <rect x="142" y="0" width="106" height="26" class="pill-box"/>
      <circle cx="152" cy="13" r="2.5" fill="#B8325A"/>
      <text x="162" y="17" class="pill-text">Host Auditing</text>
    </g>

    <!-- Pills Row 3 -->
    <g transform="translate(14, 112)">
      <rect x="0" y="0" width="126" height="26" class="pill-box"/>
      <circle cx="10" cy="13" r="2.5" fill="#8B1E3F"/>
      <text x="20" y="17" class="pill-text">Vulnerability Res.</text>

      <rect x="134" y="0" width="114" height="26" class="pill-box"/>
      <circle cx="144" cy="13" r="2.5" fill="#8B1E3F"/>
      <text x="154" y="17" class="pill-text">Network Analysis</text>
    </g>
  </g>

  <!-- ==================== COLUMN 3: TOOLS & ECOSYSTEM ==================== -->
  <g transform="translate(606, 52)">
    <!-- Panel Background -->
    <rect x="0" y="0" width="276" height="162" rx="5" fill="url(#panelGrad)" stroke="#221D27" stroke-width="1"/>
    
    <!-- Category Header -->
    <circle cx="16" cy="20" r="3" fill="#B8325A"/>
    <text x="26" y="24" class="col-header">TOOLS &amp; ECOSYSTEM</text>
    <text x="260" y="23" text-anchor="end" class="col-tag">[03]</text>
    <line x1="14" y1="34" x2="262" y2="34" stroke="#221D27" stroke-width="1"/>

    <!-- Pills Row 1 -->
    <g transform="translate(14, 44)">
      <rect x="0" y="0" width="96" height="26" class="pill-box"/>
      <circle cx="10" cy="13" r="2.5" fill="#B8325A"/>
      <text x="20" y="17" class="pill-text">Wireshark</text>

      <rect x="104" y="0" width="96" height="26" class="pill-box"/>
      <circle cx="114" cy="13" r="2.5" fill="#B8325A"/>
      <text x="124" y="17" class="pill-text">Burp Suite</text>
    </g>

    <!-- Pills Row 2 -->
    <g transform="translate(14, 78)">
      <rect x="0" y="0" width="116" height="26" class="pill-box"/>
      <circle cx="10" cy="13" r="2.5" fill="#B8325A"/>
      <text x="20" y="17" class="pill-text">GDB / strace</text>

      <rect x="124" y="0" width="76" height="26" class="pill-box"/>
      <circle cx="134" cy="13" r="2.5" fill="#B8325A"/>
      <text x="144" y="17" class="pill-text">Docker</text>
    </g>

    <!-- Pills Row 3 -->
    <g transform="translate(14, 112)">
      <rect x="0" y="0" width="134" height="26" class="pill-box"/>
      <circle cx="10" cy="13" r="2.5" fill="#8B1E3F"/>
      <text x="20" y="17" class="pill-text">systemd / auditd</text>

      <rect x="142" y="0" width="68" height="26" class="pill-box"/>
      <circle cx="152" cy="13" r="2.5" fill="#8B1E3F"/>
      <text x="162" y="17" class="pill-text">Linux</text>
    </g>
  </g>
</svg>
